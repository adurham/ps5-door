<!doctype html>
<html><head><meta charset="utf-8">
<title>PS5 DOOR</title>
<meta http-equiv="cache-control" content="no-store">
</head>
<body style="font:17px/1.5 sans-serif;background:#111;color:#eee;padding:1.2em">
<h1 style="color:#4f4">PUBLIC PAGE LOADED</h1>
<p>Finding the LAN server&hellip;</p>
<p id="big" style="font-size:2em;font-weight:bold;margin:.6em 0">&nbsp;</p>
<div id="btns"></div>
<pre id="info" style="color:#888;font-size:.8em"></pre>
<script>
/* The console cannot type a URL, so this page finds the door by itself.
 * Candidates are probed with a 1x1 GIF: onload fires only if a real door answers.
 * Whichever answers first wins and the console is navigated there.
 * Fallback is a list of large tappable buttons - never a URL to type. */
var CAND = [
  'http://192.168.86.224:8080',   /* the Mac door */
  'http://192.168.86.53:8080',
  'http://192.168.86.55:8080'
];
var won = null, tries = 0, MAX = 6;
var big = document.getElementById('big');

function go(h) {
  if (won && won !== h) return;
  won = h;
  big.textContent = 'OPENING ' + h;
  try { location.href = h + '/?v=' + Date.now(); } catch (e) {}
}

function fallback() {
  if (won) return;
  big.textContent = 'Tap a server:';
  var d = document.getElementById('btns');
  for (var i = 0; i < CAND.length; i++) {
    var a = document.createElement('a');
    a.href = CAND[i] + '/';
    a.textContent = CAND[i];
    a.setAttribute('style', 'display:block;padding:1.1em;margin:.5em 0;background:#0d2a3a;' +
      'border:2px solid #4aa8d8;border-radius:10px;color:#d8f0ff;font-size:1.4em;' +
      'font-weight:bold;text-decoration:none');
    d.appendChild(a);
  }
}

function probe() {
  tries++;
  big.textContent = 'Probing (' + tries + '/' + MAX + ')\u2026';
  for (var i = 0; i < CAND.length; i++) {
    (function (h) {
      var im = new Image(), done = false;
      im.onload = function () { if (!done) { done = true; go(h); } };
      im.onerror = function () { done = true; };
      im.src = h + '/p.gif?i=' + i + '&t=' + Date.now();
    })(CAND[i]);
  }
  setTimeout(function () { if (!won && tries < MAX) probe(); else if (!won) fallback(); }, 2500);
}

document.getElementById('info').textContent =
  'UA: ' + navigator.userAgent + '\nWASM: ' + (typeof WebAssembly !== 'undefined');
probe();
</script>
</body></html>
